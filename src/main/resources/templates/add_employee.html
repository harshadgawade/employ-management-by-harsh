<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Employee — EMS</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Theme -->
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

  <!-- ── Navbar ───────────────────────────── -->
  <nav class="ems-navbar">
    <div class="brand">⚡ EMS Dashboard</div>
    <span class="nav-tag">Add Employee</span>
  </nav>

  <!-- ── Page Wrapper ─────────────────────── -->
  <div class="page-wrapper">

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">New <span>Employee</span></h1>
        <p class="page-subtitle">Fill in the details below to register a new team member.</p>
      </div>
      <a th:href="@{/}" class="btn-neon btn-secondary-neon">← Back to List</a>
    </div>

    <!-- Form Card -->
    <div class="glass-card form-card">

      <div class="form-card-header">
        <p style="font-size:0.82rem; color: var(--text-secondary); margin-bottom: 10px;">
          All fields are required.
        </p>
        <hr class="neon-divider">
      </div>

      <div class="form-card-body">
        <form th:action="@{/saveEmployee}" th:object="${employee}" method="POST" autocomplete="off">

          <!-- Name -->
          <div class="field-group">
            <label class="field-label" for="name">Full Name</label>
            <input
              id="name"
              type="text"
              th:field="*{name}"
              class="field-input"
              placeholder="e.g. Harsh Kumar"
              required
            >
          </div>

          <!-- Email -->
          <div class="field-group">
            <label class="field-label" for="email">Email Address</label>
            <input
              id="email"
              type="email"
              th:field="*{email}"
              class="field-input"
              placeholder="e.g. harsh@company.com"
              required
            >
          </div>

          <!-- Department -->
          <div class="field-group">
            <label class="field-label" for="department">Department</label>
            <input
              id="department"
              type="text"
              th:field="*{department}"
              class="field-input"
              placeholder="e.g. Engineering"
              required
            >
          </div>

          <!-- Salary -->
          <div class="field-group">
            <label class="field-label" for="salary">Salary (₹)</label>
            <input
              id="salary"
              type="number"
              step="0.01"
              min="0"
              th:field="*{salary}"
              class="field-input"
              placeholder="e.g. 75000"
              required
            >
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <button type="submit" class="btn-neon btn-success-neon">✓ Save Employee</button>
            <a th:href="@{/}" class="btn-neon btn-secondary-neon">✕ Cancel</a>
          </div>

        </form>
      </div>
    </div>
    <!-- /form-card -->

  </div>
  <!-- /page-wrapper -->

</body>
</html>
