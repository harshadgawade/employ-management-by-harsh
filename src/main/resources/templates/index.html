<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Insights - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="dashboard-container">
    
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-icon"><i class="fa-solid fa-cube"></i></div>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-item active"><i class="fa-solid fa-border-all"></i></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-chart-line"></i></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-comment"></i></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-user"></i></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i></a>
      </nav>
    </aside>

    <main class="main-content">
      
      <header class="top-header">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search something...">
        </div>
        <div class="user-profile">
          <i class="fa-regular fa-bell icon"></i>
          <div class="profile-info">
            <img src="https://i.pravatar.cc/100?img=12" alt="User Avatar">
            <div>
              <h4>Jane Danom</h4>
              <p>Profile</p>
            </div>
          </div>
        </div>
      </header>

      <div class="dashboard-grid">
        
        <div class="card card-purple">
          <div class="card-header">
            <span>15K <small class="badge">+2.54%</small></span>
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </div>
          <p>Users</p>
          <div class="sparkline-chart">
            <canvas id="sparkline1"></canvas>
          </div>
        </div>

        <div class="card card-orange">
          <div class="card-header">
            <span>28.9% <small class="badge">-2.54%</small></span>
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </div>
          <p>Conversion Rate</p>
          <div class="bar-sparkline">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="card card-coral">
          <div class="card-header">
            <span>24K <small class="badge">+2.54%</small></span>
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </div>
          <p>Sessions</p>
          <div class="sparkline-chart">
            <canvas id="sparkline2"></canvas>
          </div>
        </div>

        <div class="card card-white reviews-card">
          <div class="card-header">
            <h3>Reviews</h3>
          </div>
          <div class="radial-chart-container">
            <div class="radial-center">
              <h2>3272</h2>
              <p>Reviews</p>
            </div>
          </div>
        </div>

        <div class="card card-white main-chart-card">
          <div class="chart-header">
            <div>
              <h3>Analytic</h3>
              <h2>$ 956,124.78</h2>
              <p class="growth"><i class="fa-solid fa-arrow-up"></i> 22% <span>Since Last Month</span></p>
            </div>
            <div class="chart-filter">
              <button class="active">This Year</button>
              <button>Last Year</button>
            </div>
          </div>
          <div class="main-bar-chart">
            <canvas id="analyticsBarChart"></canvas>
          </div>
        </div>

        <div class="card card-white recent-uploads">
          <h3>Latest Upload</h3>
          <ul class="upload-list">
            <li>
              <div class="thumb"></div>
              <div class="info">
                <h4>Animal & Natural</h4>
                <p>10:00 am, 24 June, 2026</p>
              </div>
              <span class="status-done">Done</span>
            </li>
            <li>
              <div class="thumb"></div>
              <div class="info">
                <h4>Animal & Natural</h4>
                <p>10:00 am, 24 June, 2026</p>
              </div>
              <span class="status-done">Done</span>
            </li>
          </ul>
        </div>

      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
