spring.application.name=employee-management

# ── Database — Persistent File-Based H2 ────────
# Data is stored in /database/employeedb.mv.db inside the project folder
# Change ./database/employeedb to an absolute path if needed
# e.g. jdbc:h2:file:C:/myproject/database/employeedb
spring.datasource.url=jdbc:h2:file:./database/employeedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── JPA / Hibernate ─────────────────────────────
# update = keep existing data and add new columns automatically
# create-drop = wipe data on every restart (not recommended for persistent DB)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Web Console ──────────────────────────────
# Access at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./database/employeedb
# Username: sa  |  Password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── DevTools / Live Reload ──────────────────────
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false
spring.devtools.livereload.enabled=true
