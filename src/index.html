<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HR Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    @keyframes fadeInUp { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }
    .login-box { animation: fadeInUp 0.5s ease forwards; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-box" id="loginBox">

    <!-- Logo -->
    <div class="login-logo">⚡ EMS Portal</div>
    <div class="login-tagline">HR &amp; Department Owner Access Only</div>

    <!-- ── STEP 1: Email ───────────────────── -->
    <div class="login-step active" id="step1">
      <div class="login-title">Welcome Back</div>
      <div class="login-subtitle">Enter your registered <strong>@company.com</strong> email address to continue.</div>

      <div class="l-field">
        <label class="l-label" for="loginEmail">Work Email</label>
        <input class="l-input" type="email" id="loginEmail"
               placeholder="yourname@company.com" autocomplete="email">
        <span class="l-error" id="emailError"></span>
      </div>

      <button class="btn-login" id="btnSendOTP">Send OTP →</button>

      <div style="margin-top:20px;text-align:center;font-size:0.72rem;color:var(--text-muted)">
        🔒 Access restricted to authorised HR personnel only
      </div>
    </div>

    <!-- ── STEP 2: OTP ─────────────────────── -->
    <div class="login-step" id="step2">
      <div class="login-title">Verify OTP</div>
      <div class="login-subtitle">
        A 6-digit OTP has been sent to<br>
        <strong id="otpEmailDisplay" style="color:var(--gold)"></strong>
      </div>

      <!-- 6 digit boxes -->
      <div class="otp-row">
        <input class="otp-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
        <input class="otp-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*">
        <input class="otp-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*">
        <input class="otp-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*">
        <input class="otp-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*">
        <input class="otp-digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*">
      </div>

      <div class="otp-timer">
        Code expires in <span id="otpTimerVal">60</span>s &nbsp;
        <button class="otp-resend" id="resendBtn">Resend OTP</button>
      </div>

      <span class="l-error" id="otpError"></span>

      <button class="btn-login" id="btnVerifyOTP">Verify &amp; Login</button>
      <button class="btn-back" id="btnBack">← Change email</button>
    </div>

  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="js/main.js"></script>
</body>
</html>
